name: Lumen SKU share mobile smoke
on:
  push:
    paths:
      - .github/workflows/lumen-share-smoke.yml
  workflow_dispatch:
jobs:
  safari-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps webkit
      - name: Validate live mobile SKU and direct long-press download
        run: |
          node <<'NODE'
          const {webkit,devices}=require('playwright');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage({...devices['iPhone 13']});
            try{
              await page.addInitScript(()=>{
                window.__skuDownloadTest=null;
                const normal=HTMLAnchorElement.prototype.click;
                HTMLAnchorElement.prototype.click=function(){
                  if(this.download&&this.download.startsWith('REF-')){
                    window.__skuDownloadTest={filename:this.download,blob:this.href.startsWith('blob:')};
                    return;
                  }
                  return normal.call(this);
                };
              });
              const reply=await page.goto('https://www.lumenluxos.com/',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>window.__lumenShareV5?.ready,{timeout:30000});
              await page.waitForTimeout(9000);
              const check=await page.evaluate(()=>{
                const refs=[...document.querySelectorAll('.lumen-v5-ref')];
                const first=refs[0];
                const imgs=[...document.images].filter(x=>x.getBoundingClientRect().height>100);
                return{
                  count:refs.length,
                  ref:first?.textContent,
                  noDownloadButtons:document.querySelectorAll('.lumen-v3-btn,.lumen-v4-ref').length===0,
                  noModal:document.querySelector('.lumen-v3-mask')===null,
                  firstBadgeY:Math.round(first?.getBoundingClientRect().top||0),
                  imageBottom:Math.round(imgs[0]?.getBoundingClientRect().bottom||0)
                };
              });
              console.log('LUMEN_V5_CARD',JSON.stringify({http:reply.status(),...check}));
              if(reply.status()>=400||check.count<2||!check.noDownloadButtons||!check.noModal)
                throw Error('SKU_V5_CARD_INVALID');
              const img=page.locator('img[src*="1e8b62_055456"]').first();
              if(!await img.count())throw Error('PRODUCT_IMAGE_NOT_FOUND');
              await img.evaluate(el=>{
                el.dispatchEvent(new PointerEvent('pointerdown',{
                  bubbles:true,cancelable:true,pointerType:'mouse',button:0,clientX:160,clientY:210
                }));
              });
              await page.waitForFunction(()=>window.__skuDownloadTest?.blob,{timeout:20000});
              const saved=await page.evaluate(()=>({download:window.__skuDownloadTest,
                result:window.__lumenShareV5?.lastDownload,
                hasModal:!!document.querySelector('.lumen-v3-mask')}));
              console.log('LUMEN_V5_DOWNLOAD',JSON.stringify(saved));
              if(!saved.download?.filename.startsWith('REF-')||saved.hasModal||
                 !(saved.result?.size>8000))throw Error('DIRECT_9X16_DOWNLOAD_FAILED');
            }finally{await browser.close()}
          })().catch(e=>{console.error('LUMEN_SMOKE_FAILURE',e.message);process.exit(1)});
          NODE
