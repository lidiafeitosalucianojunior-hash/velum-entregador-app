name: Lumen SKU iPhone native sharing smoke
on:
  push:
    paths:
      - .github/workflows/lumen-share-smoke.yml
  workflow_dispatch:
jobs:
  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps webkit
      - name: Check live SKU layout and mock iPhone share chooser
        run: |
          node <<'NODE'
          const {webkit,devices}=require('playwright');
          const fail=s=>{throw Error(s)};
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage({...devices['iPhone 13']});
            page.on('pageerror',e=>console.log('PAGE_JS_WARNING',e.message.slice(0,240)));
            await page.addInitScript(()=>{
              window.__shareCalls=[];
              window.__downloadCalls=[];
              const normal=HTMLAnchorElement.prototype.click;
              HTMLAnchorElement.prototype.click=function(){
                if(this.download){window.__downloadCalls.push(this.download);return}
                return normal.call(this);
              };
              Object.defineProperty(navigator,'share',{configurable:true,value:async arg=>{
                window.__shareCalls.push({fileCount:arg?.files?.length||0,
                  names:(arg?.files||[]).map(f=>f.name),
                  sizes:(arg?.files||[]).map(f=>f.size)});
              }});
              Object.defineProperty(navigator,'canShare',{configurable:true,value:arg=>
                Array.isArray(arg.files)&&arg.files.length<=6&&
                arg.files.every(f=>f.type==='image/jpeg')});
            });
            try{
              const response=await page.goto('https://www.lumenluxos.com/',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>window.__lumenShareV6?.ready,{timeout:45000});
              await page.waitForTimeout(7500);
              const layout=await page.evaluate(()=>{
                const img=[...document.images].find(i=>i.src.includes('1e8b62_055456'));
                const card=img?.closest('[class*="wixui-repeater__i"]');
                const ref=card?.querySelector('[data-lumen-sku="7729"]');
                const share=card?.querySelector('compartilhar-produto');
                if(!img||!card||!ref||!share)return {found:false};
                const a=ref.getBoundingClientRect(),b=share.getBoundingClientRect();
                return{found:true,refs:document.querySelectorAll('.lumen-v6-ref').length,
                  ref:{x:a.left,y:a.top,right:a.right,midY:(a.top+a.bottom)/2},
                  share:{x:b.left,y:b.top,midY:(b.top+b.bottom)/2},
                  overlap:a.right>b.left-5,
                  aligned:Math.abs((a.top+a.bottom)/2-(b.top+b.bottom)/2)<5,
                  noOldRefs:document.querySelectorAll('.lumen-v5-ref,.lumen-v5-share-sku-row').length===0,
                  noOldModals:document.querySelectorAll('.lumen-v3-mask').length===0};
              });
              console.log('LUMEN_V6_LAYOUT',JSON.stringify({http:response.status(),...layout}));
              if(response.status()>=400||!layout.found||layout.refs<2||
                layout.overlap||!layout.aligned||!layout.noOldRefs||!layout.noOldModals)
                fail('SKU_NOT_ALIGNED_OR_OLD_UI');
              const img=page.locator('img[src*="1e8b62_055456"]').first();
              for(let attempt=0;attempt<5;attempt++){
                await img.evaluate(el=>{
                  const e=new Event('touchstart',{bubbles:true,cancelable:true});
                  Object.defineProperty(e,'touches',{value:[{clientX:75,clientY:420}]});
                  el.dispatchEvent(e);
                });
                await page.waitForTimeout(725);
                await img.evaluate(el=>{
                  const e=new Event('touchend',{bubbles:true,cancelable:true});
                  Object.defineProperty(e,'touches',{value:[]});
                  el.dispatchEvent(e);
                });
                await page.waitForTimeout(1100);
                if(await page.evaluate(()=>window.__shareCalls.length>0))break;
              }
              const one=await page.evaluate(()=>({
                calls:window.__shareCalls,downloads:window.__downloadCalls,
                final:window.__lumenShareV6?.lastShared,
                modal:!!document.querySelector('.lumen-v3-mask')
              }));
              console.log('LUMEN_V6_SINGLE',JSON.stringify(one));
              if(!one.calls.length||one.calls[0].fileCount!==1||
                one.calls[0].names[0]!=='REF-7729-9x16.jpg'||
                one.downloads.length||one.modal)fail('LONGPRESS_DID_NOT_USE_NATIVE_SHARE');
              const filter=page.getByText('34',{exact:true}).first();
              await filter.click({timeout:8000});
              await page.waitForFunction(()=>{
                const b=document.querySelector('.lumen-v6-bulk');
                return b&&!b.hidden;
              },{timeout:20000});
              await page.waitForFunction(()=>{
                const b=document.querySelector('.lumen-v6-bulk');
                return b&&!b.hidden&&!b.disabled&&b.textContent.includes('Compartilhar');
              },{timeout:65000});
              const placeDiag=await page.evaluate(()=>{
                const short=el=>{const r=el.getBoundingClientRect();return {
                  tag:el.tagName,cls:String(el.className?.baseVal||el.className||'').slice(0,75),
                  txt:el.textContent?.trim().slice(0,90),rect:[r.x,r.y,r.width,r.height].map(n=>Math.round(n)),
                  parent:el.parentElement?.tagName,css:getComputedStyle(el).position}};
                const headings=[...document.querySelectorAll('h1,h2,h3,h4,h5,h6,[role=heading]')]
                  .filter(el=>el.getBoundingClientRect().width>0)
                  .slice(0,25).map(short);
                const filterControls=[...document.querySelectorAll('button,select,[role=combobox],input')]
                 .filter(el=>{const r=el.getBoundingClientRect();return r.top>150&&r.top<700&&r.width>90;})
                 .slice(0,18).map(short);
                const bulk=document.querySelector('.lumen-v6-bulk');
                return{headings,filterControls,bulk:bulk?short(bulk):null,
                 afterTitle:[...document.querySelectorAll('[data-testid="richTextElement"]')]
                  .filter(x=>/^(?:SALTO|RASTEIRA|CONFIRA AS NOVIDADES!)$/i.test(x.innerText?.trim()||''))
                  .slice(0,10).map(short)};
              });
              console.log('LUMEN_BULK_POSITION_DOM',JSON.stringify(placeDiag));
              const chainDiag=await page.evaluate(()=>{
                const short=el=>{if(!el)return null;const r=el.getBoundingClientRect(),css=getComputedStyle(el);return{
                  tag:el.tagName,cls:String(el.className?.baseVal||el.className||'').slice(0,80),
                  id:el.id,txt:el.innerText?.trim().slice(0,65),
                  rect:[r.x,r.y,r.width,r.height].map(n=>Math.round(n)),display:css.display,
                  position:css.position,gridColumn:css.gridColumn,gridRow:css.gridRow,
                  paddingBottom:css.paddingBottom,marginBottom:css.marginBottom
                }};
                const h=[...document.querySelectorAll('h2')].find(x=>/CONFIRA AS NOVIDADES|SALTO|RASTEIRA/i.test(x.textContent));
                const sel=document.querySelector('select.wixui-dropdown__input');
                const climb=el=>{const arr=[];for(let i=0;el&&i<7;i++,el=el.parentElement)arr.push(short(el));return arr};
                return{heading:climb(h),select:climb(sel),images:short(document.querySelector('img[src*="1e8b62_055456"]'))};
              });
              console.log('LUMEN_BULK_CHAINS',JSON.stringify(chainDiag));

              const bulkBefore=await page.locator('.lumen-v6-bulk').textContent();
              await page.locator('.lumen-v6-bulk').click();
              await page.waitForTimeout(850);
              const bulk=await page.evaluate(()=>({
                button:document.querySelector('.lumen-v6-bulk')?.textContent,
                last:window.__shareCalls.at(-1),
                totalCalls:window.__shareCalls.length,
                downloads:window.__downloadCalls.length
              }));
              console.log('LUMEN_V6_BULK',JSON.stringify({before:bulkBefore,...bulk}));
              if(bulk.totalCalls<2||bulk.last.fileCount<2||bulk.last.fileCount>6||
                bulk.downloads!==0||bulk.last.names.some(n=>!n.startsWith('REF-')))fail('BULK_SHARE_FAILED');
            }finally{await browser.close()}
          })().catch(e=>{console.error('LUMEN_V6_SMOKE_FAILED',e.stack||e);process.exit(1)});
          NODE
