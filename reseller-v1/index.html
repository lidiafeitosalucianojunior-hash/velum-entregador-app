<script>
/* A antiga tela de instalação/pareamento não faz mais parte do fluxo. */
(function () {
  const url = new URL('https://www.vaidevelum.com/painel-revendedora');
  const oldQuery = new URLSearchParams(location.search);
  if (oldQuery.get('open') === 'dashboard' || oldQuery.get('frompush') === '1') {
    url.searchParams.set('frompush', '1');
  }
  if (oldQuery.get('novo') === '1') url.searchParams.set('novo', '1');
  location.replace(url.toString());
})();
</script>
